name: Community Authentik images

on:
  push:
    branches: [feat/authentik-oidc]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: v1.4.2-authentik.3

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U plane" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: valkey/valkey:7-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -f apps/api/Dockerfile.oidc -t plane-oidc-test apps/api
      - name: Test OIDC and migration state
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://plane:plane@localhost:5432/plane \
            -e REDIS_URL=redis://localhost:6379/ \
            -e DJANGO_SETTINGS_MODULE=plane.settings.test \
            -v "$PWD/apps/api:/code" --entrypoint /bin/sh plane-oidc-test -c '
              pip install -r requirements/test.txt &&
              pytest plane/tests/unit/views/test_oidc.py &&
              python manage.py makemigrations --check --dry-run
            '
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend
        run: |
          docker tag plane-oidc-test ghcr.io/barryw/plane-backend-oidc:$IMAGE_TAG
          docker push ghcr.io/barryw/plane-backend-oidc:$IMAGE_TAG

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          push: true
          tags: ghcr.io/barryw/plane-web-oidc:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
